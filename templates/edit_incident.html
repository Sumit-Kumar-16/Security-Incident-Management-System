{% extends "base.html" %}

{% block title %}
Edit Incident
{% endblock %}

{% block content %}

<div class="page-header">


<div>

    <h1>
        Edit Incident #{{ incident.id }}
    </h1>

    <p>
        Update incident information and severity.
    </p>

</div>


</div>

<div class="form-card">


<form method="POST">


    <div class="form-group">

        <label>
            Incident Title
        </label>

        <input
            type="text"
            name="title"
            class="form-control"
            value="{{ incident.title }}"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
            name="description"
            class="form-control"
            required>{{ incident.description }}</textarea>

    </div>


    <div class="form-group">

        <label>
            Severity
        </label>

        <select
            name="severity"
            class="form-control"
            required>

            <option value="Low"
                {% if incident.severity == "Low" %}selected{% endif %}>
                Low
            </option>

            <option value="Medium"
                {% if incident.severity == "Medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="High"
                {% if incident.severity == "High" %}selected{% endif %}>
                High
            </option>

            <option value="Critical"
                {% if incident.severity == "Critical" %}selected{% endif %}>
                Critical
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>
            Source IP Address
        </label>

        <input
            type="text"
            name="source_ip"
            class="form-control"
            value="{{ incident.source_ip or '' }}"
        >

    </div>


    <button
        type="submit"
        class="btn btn-primary">

        Save Changes

    </button>


    <a
        href="{{ url_for('incident_details', id=incident.id) }}"
        class="btn btn-secondary">

        Cancel

    </a>


</form>


</div>

{% endblock %}
