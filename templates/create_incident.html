{% extends "base.html" %}

{% block title %}
Create Incident
{% endblock %}

{% block content %}

<div class="page-header">


<div>

    <h1>Create Security Incident</h1>

    <p>
        Record a new security event for investigation.
    </p>

</div>


</div>

<div class="form-card">


<form method="POST">


    <div class="form-group">

        <label>
            Incident Title
        </label>

        <input
            type="text"
            name="title"
            class="form-control"
            placeholder="Example: Multiple Failed Login Attempts"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
            name="description"
            class="form-control"
            placeholder="Describe the security incident..."
            required></textarea>

    </div>


    <div class="form-group">

        <label>
            Severity
        </label>

        <select
            name="severity"
            class="form-control"
            required>

            <option value="">
                Select Severity
            </option>

            <option value="Low">
                Low
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="High">
                High
            </option>

            <option value="Critical">
                Critical
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>
            Source IP Address
        </label>

        <input
            type="text"
            name="source_ip"
            class="form-control"
            placeholder="Example: 192.168.1.45"
        >

    </div>


    <button
        type="submit"
        class="btn btn-primary">

        Create Incident

    </button>


    <a
        href="{{ url_for('incidents') }}"
        class="btn btn-secondary">

        Cancel

    </a>


</form>


</div>

{% endblock %}
