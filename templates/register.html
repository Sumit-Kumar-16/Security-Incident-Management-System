<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">


</head>

<body>

<div class="auth-page">


<div class="auth-container">


    <div class="auth-title">

        <h1>Create Security Account</h1>

        <p>
            Register for the Security Incident Management System
        </p>

    </div>


    <div class="auth-card"
         style="max-width: 600px; margin: auto;">


        <h2>Create Account</h2>


        <form method="POST"
              action="{{ url_for('register') }}">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a secure password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Create Account

            </button>


        </form>


        <div class="auth-info">

            New accounts receive
            <strong>Viewer</strong> permissions.

            <br>

            Contact an administrator if elevated
            access is required.

        </div>


        <br>


        <a
            href="{{ url_for('login') }}"
            class="btn btn-secondary">

            Back to Login

        </a>


    </div>


</div>


</div>

</body>

</html>
